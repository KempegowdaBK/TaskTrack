<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskTrack – Smart Task Manager</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">✅</span>
        <span class="logo-text">TaskTrack</span>
      </div>
      <p class="tagline">Smart Task Management System</p>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────────────── -->
  <main class="container">

    <!-- Summary cards -->
    <section class="summary-grid" aria-label="Task summary">
      <div class="card card-total">
        <div class="card-value" id="count-total">0</div>
        <div class="card-label">Total Tasks</div>
      </div>
      <div class="card card-pending">
        <div class="card-value" id="count-pending">0</div>
        <div class="card-label">Pending</div>
      </div>
      <div class="card card-completed">
        <div class="card-value" id="count-completed">0</div>
        <div class="card-label">Completed</div>
      </div>
    </section>

    <!-- Add task form -->
    <section class="form-section">
      <h2 class="section-title">Add New Task</h2>
      <form id="task-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="task-title">Task Title <span class="required">*</span></label>
            <input
              type="text"
              id="task-title"
              placeholder="e.g. Complete assignment"
              maxlength="100"
              required
            />
          </div>
          <div class="form-group">
            <label for="task-desc">Description</label>
            <input
              type="text"
              id="task-desc"
              placeholder="e.g. Chapter 5 – due Friday"
              maxlength="200"
            />
          </div>
        </div>
        <button type="submit" class="btn btn-add">＋ Add Task</button>
      </form>
      <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
    </section>

    <!-- Task list -->
    <section class="list-section">
      <h2 class="section-title">All Tasks</h2>
      <div id="task-list">
        <!-- Tasks rendered by JavaScript -->
        <p id="empty-msg" class="empty-msg">No tasks yet. Add one above! 🎉</p>
      </div>
    </section>

  </main>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <footer class="footer">
    <p>TaskTrack &copy; 2025 — College Demo Project &nbsp;|&nbsp; Flask + Jenkins + pytest</p>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
